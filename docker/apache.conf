ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/public/uploads>
    AllowOverride None
    Options -Indexes -ExecCGI
    <FilesMatch "\.(?i:php[0-9]*|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
